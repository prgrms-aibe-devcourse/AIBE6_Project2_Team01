<h2>모델 목록 정렬 기준 선택</h2>
<p class="subtitle">모델 리스트 페이지에서 사용할 정렬 기준을 선택해 주세요. (중복 선택 가능)</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="recommended" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>추천순 (기본값)</h3>
      <p>AI가 의뢰인에게 가장 적합한 모델을 상단에 노출합니다.</p>
    </div>
  </div>
  <div class="option" data-choice="latest" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>최신순</h3>
      <p>가장 최근에 가입하거나 프로필을 업데이트한 모델 순서입니다.</p>
    </div>
  </div>
  <div class="option" data-choice="rating" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>별점순</h3>
      <p>리뷰 평점이 높은 모델을 우선적으로 보여줍니다.</p>
    </div>
  </div>
  <div class="option" data-choice="popular" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>인기순</h3>
      <p>조회수나 매칭 횟수가 많은 모델을 상단에 노출합니다.</p>
    </div>
  </div>
</div>
