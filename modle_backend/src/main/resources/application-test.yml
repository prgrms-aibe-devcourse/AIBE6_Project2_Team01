spring:
  datasource:
    url: jdbc:mysql://localhost:3306/modle_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  cloud:
    gcp:
      storage:
        enabled: false

jwt:
  secret: ${JWT_SECRET}

gcs:
  bucket: ${GCS_BUCKET_NAME:test-dummy}